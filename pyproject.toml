[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-studio"
version = "0.1.0"
description = "Local MIDI production and independent generative music adapters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "soundfile>=0.13,<0.14", "mido>=1.3,<2", "PyYAML>=6,<7", "pyloudnorm>=0.1.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
music-studio = "music_studio.cli:main"

[project.urls]
Repository = "https://github.com/fix-all/ai-music-studio"
Issues = "https://github.com/fix-all/ai-music-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
